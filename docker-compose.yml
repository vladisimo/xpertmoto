services:
  postgres:
    # TimescaleDB (drop-in for the official postgres:16 image) powers the
    # VehicleTelemetry hypertable for GPS tracking history. timescaledb MUST be
    # in shared_preload_libraries (below) or `CREATE EXTENSION timescaledb` fails.
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xpertmoto
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Init scripts run once on a fresh data volume.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # shared_preload_libraries: timescaledb (required) + pg_stat_statements
    # (per-query stats). The rest is a modest dev-tier tuning baseline — adjust
    # in prod based on actual container memory allocation.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb,pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "random_page_cost=1.1"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xpertmoto"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-03T14-56-28Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9002:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-03T17-07-56Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/xpertmoto;
      mc anonymous set download local/xpertmoto;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/xpertmoto?connection_limit=10&pool_timeout=20
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: dev-secret-change-me-in-prod
      AUTH_URL: http://localhost:3000
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ap-southeast-2
      S3_BUCKET: xpertmoto
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: http://localhost:9000/xpertmoto
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      EMAIL_FROM: no-reply@xpertmoto.com.au
      NODE_ENV: development
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    command: ["sh", "-c", "npm install && npx prisma generate && npx prisma migrate deploy && npm run dev"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/xpertmoto?connection_limit=10&pool_timeout=20
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ap-southeast-2
      S3_BUCKET: xpertmoto
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      EMAIL_FROM: no-reply@xpertmoto.com.au
      NODE_ENV: development
    volumes:
      - ./:/app
      - /app/node_modules
    # `exec` so SIGTERM reaches node and the worker's graceful drain runs.
    command: ["sh", "-c", "sleep 10 && exec npm run worker"]
    # Must exceed the worker's 60s in-flight-job drain (SHUTDOWN_TIMEOUT_MS
    # in src/server/jobs/worker.ts) or docker SIGKILLs mid-payment-capture.
    stop_grace_period: 75s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.WORKER_HEALTH_PORT||8786)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  postgres-data:
  redis-data:
  minio-data:
