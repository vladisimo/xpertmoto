<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <!-- RIGHT side view of a generic scooter (right flank facing viewer). Mirror of left, with exhaust visible on this side. -->
  <!-- Rear wheel -->
  <circle cx="180" cy="470" r="85" />
  <circle cx="180" cy="470" r="36" />
  <!-- Front wheel -->
  <circle cx="780" cy="470" r="85" />
  <circle cx="780" cy="470" r="36" />
  <!-- Front fender -->
  <path d="M 695 440 Q 780 360 865 440" />
  <!-- Rear fender / tail -->
  <path d="M 95 440 Q 180 360 265 440 L 265 470" />
  <!-- Body / footboard -->
  <path d="M 265 470 L 330 470 L 360 440 L 575 440 L 605 470 L 695 470" />
  <!-- Seat -->
  <path d="M 260 380 Q 270 355 310 355 L 460 355 Q 515 355 540 380 L 540 440" />
  <!-- Rear tail box / grab rail -->
  <path d="M 310 355 Q 225 340 190 375 L 190 420" />
  <!-- Front fairing -->
  <path d="M 575 440 Q 595 390 615 320 Q 620 280 605 250 L 580 235" />
  <!-- Windshield -->
  <path d="M 580 235 Q 560 190 540 145 L 525 150 Q 540 200 555 250" />
  <!-- Handlebar -->
  <line x1="555" y1="250" x2="505" y2="215" />
  <circle cx="500" cy="212" r="7" fill="#64748b" />
  <!-- Mirror -->
  <line x1="525" y1="150" x2="505" y2="110" />
  <ellipse cx="500" cy="102" rx="18" ry="12" />
  <!-- Headlight -->
  <ellipse cx="610" cy="340" rx="22" ry="14" />
  <!-- Exhaust muffler -->
  <rect x="280" y="478" width="130" height="26" rx="12" />
  <line x1="410" y1="491" x2="440" y2="491" stroke-width="5" />
  <!-- View label -->
  <text x="40" y="55" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#64748b" stroke="none" letter-spacing="2">RIGHT</text>
  <text x="40" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" stroke="none" letter-spacing="1">placeholder</text>
</svg>
