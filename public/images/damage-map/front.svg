<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <!-- FRONT view of a generic scooter (head-on, at hub height) -->
  <!-- Front wheel (head-on = narrow ellipse) -->
  <ellipse cx="500" cy="505" rx="52" ry="14" />
  <!-- Tyre sidewall -->
  <path d="M 448 505 Q 448 430 500 430 Q 552 430 552 505" />
  <!-- Fork tubes -->
  <line x1="470" y1="445" x2="470" y2="305" />
  <line x1="530" y1="445" x2="530" y2="305" />
  <!-- Front fender -->
  <path d="M 448 490 Q 500 465 552 490" />
  <!-- Front fairing body -->
  <path d="M 420 460 L 380 330 Q 375 260 410 215 L 420 190 L 580 190 L 590 215 Q 625 260 620 330 L 580 460 Z" />
  <!-- Leg shield panel seam -->
  <line x1="500" y1="205" x2="500" y2="460" stroke-dasharray="6 8" opacity="0.45" />
  <!-- Twin headlights -->
  <ellipse cx="450" cy="305" rx="28" ry="20" />
  <ellipse cx="550" cy="305" rx="28" ry="20" />
  <!-- Windshield -->
  <path d="M 395 210 Q 500 150 605 210" />
  <path d="M 405 195 Q 500 130 595 195" opacity="0.6" />
  <!-- Handlebars -->
  <line x1="330" y1="175" x2="670" y2="175" stroke-width="5" />
  <line x1="330" y1="175" x2="320" y2="195" stroke-width="5" />
  <line x1="670" y1="175" x2="680" y2="195" stroke-width="5" />
  <!-- Mirrors -->
  <line x1="360" y1="175" x2="315" y2="120" />
  <ellipse cx="305" cy="108" rx="22" ry="14" />
  <line x1="640" y1="175" x2="685" y2="120" />
  <ellipse cx="695" cy="108" rx="22" ry="14" />
  <!-- View label -->
  <text x="40" y="55" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#64748b" stroke="none" letter-spacing="2">FRONT</text>
  <text x="40" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" stroke="none" letter-spacing="1">placeholder</text>
</svg>
