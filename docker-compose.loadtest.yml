# ─────────────────────────────────────────────────────────────────────────
# Isolated, resource-capped, production-build stack for load testing.
#
#   docker compose -p xpltest -f docker-compose.loadtest.yml up -d
#
# Fully isolated from the dev stack:
#   - own project name (xpltest), own volumes, own published ports (5xxxx/3001)
#   - never touches the dev DB (localhost:5432) / redis (6380) / minio (9000)
#
# app/worker run the PROD build (`next start` / `npm run worker`) on a plain
# node:20 image (glibc, matches the host) bind-mounting the repo so they reuse
# the host-built node_modules + .next-loadtest — no npm ci, no image build.
#
# The `cpus`/`mem_limit` caps ARE the instance-sizing experiment: each cap
# maps to a candidate cloud instance / hardware spec. Sweep them between runs.
# ─────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xpertmoto
    ports:
      - "55432:5432"
    volumes:
      - lt-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb,pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "random_page_cost=1.1"
    cpus: 2.0
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xpertmoto"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "55379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - lt-redis:/data
    cpus: 0.5
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-03T14-56-28Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "55900:9000"
      - "55901:9001"
    volumes:
      - lt-minio:/data
    cpus: 1.0
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-03T17-07-56Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/xpertmoto;
      mc anonymous set download local/xpertmoto;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "51025:1025"
      - "58025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    cpus: 0.5
    mem_limit: 256m

  app:
    image: node:20
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      NEXT_DIST_DIR: .next-loadtest
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/xpertmoto?connection_limit=10&pool_timeout=20
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: WfdAj+GJ3QjMAytBvLb0MbuI+cQrMZfP2mhPXbfPLXY=
      SECRET_ENC_KEY: XtsXG4vZUOA9ZusQDqoTlLTTtUwYvDrXRt/wYTs4/kc=
      IP_HASH_SALT: 0d18c1d98d07ffd5139c9c2e353df2dc
      AUTH_URL: http://localhost:3009
      APP_URL: http://localhost:3009
      NEXT_PUBLIC_APP_URL: http://localhost:3009
      ALLOW_STUB_STRIPE: "1"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      EMAIL_FROM: no-reply@loadtest.local
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:55900/xpertmoto
      S3_REGION: ap-southeast-2
      S3_BUCKET: xpertmoto
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      LOADTEST_RATELIMIT_OFF: "1"
      LOG_LEVEL: warn
      SLOW_QUERY_MS: "200"
    volumes:
      - ./:/app
    command: ["npm", "run", "start"]
    ports:
      - "3009:3000"
    # ── sizing knob: sweep these between runs (1 vCPU / 1 GB ≈ small instance) ──
    cpus: 1.0
    mem_limit: 1g

  worker:
    image: node:20
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/xpertmoto?connection_limit=10&pool_timeout=20
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: WfdAj+GJ3QjMAytBvLb0MbuI+cQrMZfP2mhPXbfPLXY=
      SECRET_ENC_KEY: XtsXG4vZUOA9ZusQDqoTlLTTtUwYvDrXRt/wYTs4/kc=
      IP_HASH_SALT: 0d18c1d98d07ffd5139c9c2e353df2dc
      APP_URL: http://localhost:3009
      ALLOW_STUB_STRIPE: "1"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      EMAIL_FROM: no-reply@loadtest.local
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ap-southeast-2
      S3_BUCKET: xpertmoto
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      LOG_LEVEL: warn
    volumes:
      - ./:/app
    command: ["sh", "-c", "sleep 8 && npm run worker"]
    cpus: 0.5
    mem_limit: 512m

volumes:
  lt-postgres:
  lt-redis:
  lt-minio:
