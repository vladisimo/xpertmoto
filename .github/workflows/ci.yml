name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xpertmoto
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # connection_limit: env.ts requires it whenever NODE_ENV=production,
      # which `next build` sets during page-data collection.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xpertmoto?connection_limit=10
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      # Throwaway AES-256 key (base64 of 32 bytes) so env.ts validation passes
      # in CI. Not a real secret — env.ts requires SECRET_ENC_KEY in every
      # environment (crypto.ts at-rest encryption); without it the test,
      # integration and build steps fail at import with "Invalid environment
      # variables". Real deploys set their own via secrets.
      SECRET_ENC_KEY: zlGuVHEjGOaCSjqLhgmHsf5r97YF9EdQHHdoibKNUug=
      # `next build` runs with NODE_ENV=production, so env.ts enforces its
      # production-only requirements during page-data collection. Provide the
      # schema's stub-friendly placeholders so the build validates without
      # real third-party credentials (real deploys supply their own secrets).
      ALLOW_STUB_STRIPE: "1"
      APP_URL: http://localhost:3000
      IP_HASH_SALT: ci-ip-hash-salt-placeholder
      SMTP_HOST: localhost
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy || npx prisma db push
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:integration
      - run: npm run build
      # Fail CI on any production dependency with a known High/Critical
      # vulnerability. Dev deps are excluded to avoid noise from build-time
      # tooling.
      - run: npm audit --production --audit-level=high

  # Browser smoke against the real app: seeded e2e DB + Redis + dev server,
  # public pages and the login/portal flow. Keeps the booking funnel's front
  # door from silently breaking on main; the heavier role-scoped e2e suites
  # still run locally via `npm run test:e2e:local`.
  e2e-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xpertmoto_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # All values below are throwaway CI-only placeholders (same set as the
    # test job above) — ephemeral service containers, never real deployments.
    # Real deploys set their own secrets; env.ts rejects these in production.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xpertmoto_e2e?connection_limit=10
      REDIS_URL: redis://localhost:6379/3
      # The Playwright browser context emulates Australia/Brisbane
      # (playwright.config.ts timezoneId). The server must render in the same
      # zone or every SSR'd date/time hydrates differently and the strict
      # browser guard fails on the hydration errors. Local runs pass because
      # dev machines already sit in the same TZ as the emulated browser.
      TZ: Australia/Brisbane
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      AUTH_URL: http://localhost:3137
      AUTH_TRUST_HOST: "true"
      SECRET_ENC_KEY: zlGuVHEjGOaCSjqLhgmHsf5r97YF9EdQHHdoibKNUug=
      ALLOW_STUB_STRIPE: "1"
      APP_URL: http://localhost:3137
      IP_HASH_SALT: ci-ip-hash-salt-placeholder
      SMTP_HOST: localhost
      E2E_DB: "1"
      PORT: "3137"
      E2E_NO_RESEED: "1"
      NEXT_DIST_DIR: .next-e2e
      # Deterministic TOTP so the auth.setup project can pass the forced-2FA
      # gate for staff/admin (must match tests/e2e/_fixtures/totp.ts).
      E2E_TOTP_SECRET: GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ
      # Every Playwright worker logs in from localhost — without this the
      # auth:preauth IP bucket 429s the setup project on retries. Honoured
      # only for localhost APP_URL (src/lib/rate-limit.ts).
      LOADTEST_RATELIMIT_OFF: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # db:reset:e2e and dev:e2e load .env.e2e (gitignored locally) — provide
      # the CI equivalent pointing at the service containers.
      - name: Write .env.e2e
        run: |
          cat > .env.e2e <<'ENV'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/xpertmoto_e2e?connection_limit=10
          REDIS_URL=redis://localhost:6379/3
          NEXT_DIST_DIR=.next-e2e
          E2E_TOTP_SECRET=GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ
          LOADTEST_RATELIMIT_OFF=1
          ENV
      - run: npm run db:reset:e2e
      # Route sweeps (every page per role, strict browser-error guard) +
      # auth/portal + the stub-Stripe booking funnel. Stripe-real specs are
      # local-only (test:e2e:stripe).
      - run: npm run test:e2e:critical
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
